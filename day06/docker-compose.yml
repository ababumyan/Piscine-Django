services:

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: djangotraining
    ports:
      - "5432:5432"
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    

volumes:
  db_data:
    driver: local
    external: false