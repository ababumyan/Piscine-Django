<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Life Pro Tips{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            line-height: 1.5;
            color: #1a1a1a;
            background: #f5f5f5;
        }
        header {
            background: #2c3e50;
            color: #fff;
        }
        header nav {
            max-width: 48rem;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }
        header nav a {
            color: #ecf0f1;
            text-decoration: none;
        }
        header nav a:hover {
            text-decoration: underline;
        }
        #site-name {
            font-weight: 700;
            margin-right: auto;
        }
        #greeting {
            font-size: 1.125rem;
            font-weight: 600;
        }
        main {
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .errorlist {
            color: #c0392b;
            margin: 0.5rem 0 1rem;
            padding-left: 1.25rem;
        }
        form p {
            margin-bottom: 1rem;
        }
        form label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }
        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            max-width: 20rem;
            padding: 0.5rem;
        }
        button[type="submit"] {
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'index' %}" id="site-name">Life Pro Tips</a>
            {% if user.is_authenticated %}
                <span id="greeting">Hello {{ user.username }}!</span>
                <a href="{% url 'logout' %}">Log out</a>
            {% else %}
                <span id="greeting">Hello …</span>
                <a href="{% url 'register' %}">Register</a>
                <a href="{% url 'login' %}">Log in</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
</body>
</html>
